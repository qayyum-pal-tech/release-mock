name: Release Fast-Forward to Main

run-name: "Promote ${{ inputs.source_branch }} -> main (@${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to promote (release/* or hotfix/*)"
        required: true
        type: string

      # Display only: workflow_dispatch has no read-only inputs, so a single
      # option is the closest equivalent. The job uses env.TARGET_BRANCH.
      target_branch:
        description: "Target branch (fixed)"
        required: true
        type: choice
        options:
          - main
        default: main

# GITHUB_TOKEN is not used; all API calls use the App token.
permissions: {}

# Promotions are not cancel-safe, so an in-flight run always finishes first.
concurrency:
  group: promote-main
  cancel-in-progress: false

env:
  TARGET_BRANCH: main

jobs:
  promote:
    name: Fast-forward main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A run executes the copy of this file on the "Use workflow from" ref, so
    # only the reviewed copy on develop may promote.
    if: github.ref == 'refs/heads/develop'
    # Required reviewers; deployment branches = develop only.
    environment: release-promotion

    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          case "$SOURCE_BRANCH" in
            release/*|hotfix/*) ;;
            *)
              echo "::error::Only release/* and hotfix/* can be promoted to $TARGET_BRANCH (got '$SOURCE_BRANCH')."
              exit 1
              ;;
          esac

          # The name is interpolated into API paths: '#', '%' and '?' are legal
          # in git refs but would break or redirect the URL.
          if [[ ! "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] \
            || ! git check-ref-format "refs/heads/$SOURCE_BRANCH"; then
            echo "::error::'$SOURCE_BRANCH' is not a valid or supported branch name."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Fast-forward main
        env:
          # App token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not
          # trigger downstream "on: push" workflows on main.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          if ! SOURCE_SHA=$(gh api "repos/$REPO/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha'); then
            echo "::error::Branch '$SOURCE_BRANCH' does not exist in $REPO."
            exit 1
          fi

          # force=false makes the API reject anything that is not a
          # fast-forward, so no separate compare step is needed.
          if ! gh api --method PATCH "repos/$REPO/git/refs/heads/$TARGET_BRANCH" \
              -f sha="$SOURCE_SHA" -F force=false > /dev/null; then
            echo "::error::GitHub rejected the update of '$TARGET_BRANCH'."
            echo "Either '$TARGET_BRANCH' has commits that are not in '$SOURCE_BRANCH'"
            echo "(merge '$TARGET_BRANCH' into it first), or branch rules do not allow"
            echo "the bot App to push to '$TARGET_BRANCH'."
            exit 1
          fi

          echo "Promoted $SOURCE_BRANCH -> $TARGET_BRANCH at $SOURCE_SHA"
          echo "Promoted \`$SOURCE_BRANCH\` to \`$TARGET_BRANCH\` at \`$SOURCE_SHA\`." >> "$GITHUB_STEP_SUMMARY"
